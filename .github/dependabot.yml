version: 2
updates:
  # Versions are pinned inline in build.gradle.kts / app/build.gradle.kts.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      firebase-play:
        patterns: ["com.google.firebase*", "com.google.gms*", "com.google.android.gms*", "com.google.android.play*", "com.google.mlkit*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
