name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # USSD, SMS parser and at-rest crypto sources are gitignored here and live in a
      # private companion repo (see scripts/sync-private-sources.sh). Overlay them so
      # the app compiles.
      - name: Check out private sources
        uses: actions/checkout@v7
        with:
          repository: mboyacodes-sketch/LipaBill-private
          ssh-key: ${{ secrets.PRIVATE_SRC_DEPLOY_KEY }}
          path: .private-src
          persist-credentials: false

      - name: Overlay private sources
        run: |
          rsync -a --exclude .git .private-src/ ./
          rm -rf .private-src

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testPlayDebugUnitTest lintPlayRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
