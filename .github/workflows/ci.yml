name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # USSD, SMS parser and at-rest crypto sources are gitignored here and live in a
      # private companion repo (see scripts/sync-private-sources.sh). Overlay them so
      # the app compiles.
      - name: Check out private sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mboyacodes-sketch/LipaBill-private
          ssh-key: ${{ secrets.PRIVATE_SRC_DEPLOY_KEY }}
          path: .private-src
          persist-credentials: false

      - name: Overlay private sources
        run: |
          rsync -a --exclude .git .private-src/ ./
          rm -rf .private-src

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testPlayDebugUnitTest lintPlayRelease

      # No report artifacts: this repo is public and the reports include the
      # private overlay's tests and sources. Re-run failures locally.
